      - name: Publish installable APK to GitHub Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v0.5.23-native"
          APK="Novaris-Pokedex-Native-v0.5.23.apk"
          test -s "$APK"
          VERSION_CODE=$(( ${{ github.run_number }} + 1000 ))
          NOTES="NOVARIS_VERSION_CODE=${VERSION_CODE}\nNative Android APK. Datenupdates bleiben separat."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "Novaris Pokédex Native v0.5.23" --notes "$NOTES"
          fi
          # A successful upload alone does not prove the expected APK is published.
          gh release view "$TAG" --json assets,url
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fx "$APK"
          # GitHub's asset listing can precede download availability by a few seconds.
          # Retry the verification download rather than failing a successful APK build.
          verified_download=0
          for attempt in 1 2 3 4 5; do
            if gh release download "$TAG" --pattern "$APK" --dir /tmp/novaris-release-check --clobber \
               && test -s "/tmp/novaris-release-check/$APK"; then
              verified_download=1
              break
            fi
            echo "Release asset not downloadable yet (attempt $attempt/5)"
            sleep 5
          done
          test "$verified_download" -eq 1
          cmp "$APK" "/tmp/novaris-release-check/$APK"
          echo "Verified published APK matches the locally built APK."
