name: Build Novaris Native v0.5.23

on:
  workflow_dispatch:
  push:
    branches: [ main, 'fix/v0.5.23-lifestyle-prompts', 'fix/remove-job-editor-and-optional-classes-step1', 'fix/shiny-heading-filename' ]
    paths:
      - 'native/v0.5.4/**'
      - '.github/workflows/build-native-v054.yml'
      - 'Pokedex_V27_42.html.gz'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source
        shell: bash
        run: |
          cat native/v0.4.0/part*.b64 | base64 --decode > source.zip
          # Ignore later, incomplete source snapshots; reconstruct the pre-class-change baseline.
          rm -rf appsrc
          mkdir -p appsrc
          unzip -q source.zip -d appsrc

      - name: Apply previous feature patches
        shell: bash
        run: |
          cat > /tmp/v050p00.b64 <<'EOF'
          
          EOF
          cat > /tmp/v050p01.b64 <<'EOF'
          
          EOF
          cat > /tmp/v050p02.b64 <<'EOF'
          
          EOF
          cat > /tmp/v051.b64 <<'EOF'
          
          EOF
          cat > /tmp/v052.b64 <<'EOF'
          
          EOF
          cat > /tmp/v053.b64 <<'EOF'
          
          EOF
          cat /tmp/v050p00.b64 /tmp/v050p01.b64 /tmp/v050p02.b64 | base64 --decode | gunzip > 0.5.0.patch
          base64 --decode /tmp/v051.b64 | gunzip > 0.5.1.patch
          base64 --decode /tmp/v052.b64 | gunzip > 0.5.2.patch
          base64 --decode /tmp/v053.b64 | gunzip > 0.5.3.patch
          (cd appsrc && patch -p1 < ../0.5.0.patch)
          (cd appsrc && patch -p1 < ../0.5.1.patch)
          (cd appsrc && patch -p1 < ../0.5.2.patch)
          (cd appsrc && patch -p1 < ../0.5.3.patch)

      - name: Apply v0.5.4 navigation and button-order changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path("appsrc/app/src/main/java/com/novaris/pokedex/nativeapp/MainActivity.java")
          s = main.read_text()

          old = 'private boolean restorePosition;'
          new = 'private boolean restorePosition;\n    private final List<Integer> currentPokemonDexes = new ArrayList<>();'
          if old not in s:
              raise SystemExit("MainActivity field anchor not found")
          s = s.replace(old, new, 1)

          old = 'runOnUiThread(()->{if(seq!=querySeq.get()||currentTab.equals("pokedex")==false||list!=activeList)return; list.setAdapter(new PokemonAdapter(items,false)); pCount.setText(items.size()+" Einträge"); restoreScrollIfNeeded("p",list);});'
          new = 'runOnUiThread(()->{if(seq!=querySeq.get()||currentTab.equals("pokedex")==false||list!=activeList)return; currentPokemonDexes.clear(); for(DatabaseManager.PokemonItem x:items) currentPokemonDexes.add(x.dex); list.setAdapter(new PokemonAdapter(items,false)); pCount.setText(items.size()+" Einträge"); restoreScrollIfNeeded("p",list);});'
          if old not in s:
              raise SystemExit("refreshPokedex anchor not found")
          s = s.replace(old, new, 1)

          old = 'r.setOnClickListener(v->openPokemon(p.dex));return r;'
          new = 'r.setOnClickListener(v->openPokemon(p.dex,pos,items));return r;'
          if old not in s:
              raise SystemExit("Pokemon click anchor not found")
          s = s.replace(old, new, 1)

          old = 'private void openPokemon(int dex){Intent i=new Intent(this,DetailActivity.class);i.putExtra("type","pokemon");i.putExtra("dex",dex);startActivity(i);}private void openCharacter'
          new = 'private void openPokemon(int dex,int position,List<DatabaseManager.PokemonItem> items){Intent i=new Intent(this,DetailActivity.class);i.putExtra("type","pokemon");i.putExtra("dex",dex);int[] nav=new int[items.size()];for(int k=0;k<items.size();k++)nav[k]=items.get(k).dex;i.putExtra("nav_dexes",nav);i.putExtra("nav_index",position);startActivity(i);}private void openCharacter'
          if old not in s:
              raise SystemExit("openPokemon anchor not found")
          s = s.replace(old, new, 1)

          main.write_text(s)

          detail = Path("appsrc/app/src/main/java/com/novaris/pokedex/nativeapp/DetailActivity.java")
          s = detail.read_text()

          old = 'private LinearLayout body;'
          new = 'private LinearLayout body;\n    private int[] navDexes = new int[0];\n    private int navIndex = -1;\n    private float swipeDownX, swipeDownY;'
          if old not in s:
              raise SystemExit("Detail fields anchor not found")
          s = s.replace(old, new, 1)

          old = 'ScrollView scroll=new ScrollView(this);body=new LinearLayout(this);'
          new = 'ScrollView scroll=new ScrollView(this);body=new LinearLayout(this);'
          # Add swipe listener immediately after setContentView.
          anchor = 'setContentView(scroll);\n        String type=getIntent().getStringExtra("type");'
          repl = 'setContentView(scroll);\n        navDexes=getIntent().getIntArrayExtra("nav_dexes");if(navDexes==null)navDexes=new int[0];navIndex=getIntent().getIntExtra("nav_index",-1);\n        scroll.setOnTouchListener((v,event)->handleSwipe(event,scroll));\n        String type=getIntent().getStringExtra("type");'
          if anchor not in s:
              raise SystemExit("Detail onCreate anchor not found")
          s = s.replace(anchor, repl, 1)

          old = 'private void showPokemon(int dex){\n        DatabaseManager.PokemonDetail d=data.pokemonDetail(dex);'
          new = 'private void showPokemon(int dex){\n        body.removeAllViews();\n        DatabaseManager.PokemonDetail d=data.pokemonDetail(dex);'
          if old not in s:
              raise SystemExit("showPokemon anchor not found")
          s = s.replace(old, new, 1)

          # Put image-copy before filename button for forms and shinies.
          old = 'Button fn=button(formFile);fn.setOnClickListener(v->copy(formFile+DOWNLOAD_SUFFIX));card.addView(fn,new LinearLayout.LayoutParams(match(),wrap()));\n                Button ci=button("Copy image");ci.setOnClickListener(v->ImageClipboard.copy(this,url));card.addView(ci,new LinearLayout.LayoutParams(match(),wrap()));'
          new = 'Button ci=button("Copy image");ci.setOnClickListener(v->ImageClipboard.copy(this,url));card.addView(ci,new LinearLayout.LayoutParams(match(),wrap()));\n                Button fn=button(formFile);fn.setOnClickListener(v->copy(formFile+DOWNLOAD_SUFFIX));card.addView(fn,new LinearLayout.LayoutParams(match(),wrap()));'
          if old not in s:
              raise SystemExit("form button order anchor not found")
          s = s.replace(old, new, 1)

          old = 'Button fn=button(shinyFile);fn.setOnClickListener(v->copy(shinyFile+DOWNLOAD_SUFFIX));card.addView(fn,new LinearLayout.LayoutParams(match(),wrap()));\n                Button ci=button("Copy shiny image");ci.setOnClickListener(v->ImageClipboard.copy(this,url));card.addView(ci,new LinearLayout.LayoutParams(match(),wrap()));'
          new = 'Button ci=button("Copy shiny image");ci.setOnClickListener(v->ImageClipboard.copy(this,url));card.addView(ci,new LinearLayout.LayoutParams(match(),wrap()));\n                Button fn=button(shinyFile);fn.setOnClickListener(v->copy(shinyFile+DOWNLOAD_SUFFIX));card.addView(fn,new LinearLayout.LayoutParams(match(),wrap()));'
          if old not in s:
              raise SystemExit("shiny button order anchor not found")
          s = s.replace(old, new, 1)

          anchor = 'private void copy(String s){'
          method = '''private boolean handleSwipe(MotionEvent e,ScrollView scroll){\n        if(!"pokemon".equals(getIntent().getStringExtra("type")))return false;\n        if(e.getActionMasked()==MotionEvent.ACTION_DOWN){swipeDownX=e.getX();swipeDownY=e.getY();return false;}\n        if(e.getActionMasked()==MotionEvent.ACTION_UP){float dx=e.getX()-swipeDownX,dy=e.getY()-swipeDownY;if(Math.abs(dx)>dp(80)&&Math.abs(dx)>Math.abs(dy)*1.2f&&navDexes.length>1&&navIndex>=0){int next=navIndex+(dx<0?1:-1);if(next>=0&&next<navDexes.length){navIndex=next;showPokemon(navDexes[navIndex]);scroll.post(()->scroll.scrollTo(0,0));}}}return false;}\n    private void copy(String s){'''
          if anchor not in s:
              raise SystemExit("copy anchor not found")
          s = s.replace(anchor, method, 1)

          detail.write_text(s)
          PY

          grep -n "currentPokemonDexes\|navDexes\|handleSwipe\|Copy image\|Copy shiny image" appsrc/app/src/main/java/com/novaris/pokedex/nativeapp/MainActivity.java appsrc/app/src/main/java/com/novaris/pokedex/nativeapp/DetailActivity.java

      - name: Apply Shiny reference color authority to reconstructed source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path("appsrc/app/src/main/java/com/novaris/pokedex/nativeapp/DetailActivity.java")
          replacement_file = Path("native/v0.5.4/DetailActivity.java")
          original = source.read_text()
          replacement = replacement_file.read_text()

          def method_bounds(text):
              match = re.search(r'private\s+String\s+buildShinyPrompt\s*\(', text)
              if not match:
                  raise SystemExit("Shiny prompt method not found; stopping build rather than silently omitting fix")
              start = match.start()
              brace = text.find("{", match.end())
              if brace < 0:
                  raise SystemExit("Shiny prompt method body not found")
              depth = 0
              for i in range(brace, len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          return start, i + 1
              raise SystemExit("Unclosed Shiny prompt method")

          c, d = method_bounds(replacement)
          method = replacement[c:d]
          try:
              a, b = method_bounds(original)
              updated = original[:a] + method + original[b:]
          except SystemExit:
              anchor = "private void copy(String s){"
              if anchor not in original:
                  raise SystemExit("Cannot inject Shiny method: copy anchor absent")
              updated = original.replace(anchor, method + "\n    " + anchor, 1)
          source.write_text(updated)
          assert "BLUE, NOT YELLOW" in updated
          assert "SHINY REFERENCE IMAGE" in updated
          print("Verified Shiny color authority in compiled DetailActivity")
          PY

      - name: Connect actual Shiny x1 and x3 listeners
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("appsrc/app/src/main/java/com/novaris/pokedex/nativeapp/DetailActivity.java")
          s=p.read_text()
          anchor='Button b1=button("Copy Shiny + Core + Dex x1")'
          start=s.find(anchor)
          if start<0:raise SystemExit("Actual Shiny x1 button missing")
          insert=s.find('pr.addView(b1',start)
          if insert<0 or insert-start>2000:raise SystemExit("Shiny prompt listener block missing")
          wiring='b1.setOnClickListener(v->copy(buildShinyPrompt(item.dex,shinyBase,false)));\n                b3.setOnClickListener(v->copy(buildShinyPrompt(item.dex,shinyBase,true)));\n                '
          s=s[:insert]+wiring+s[insert:]
          p.write_text(s)
          block=s[start:insert+len(wiring)+60]
          assert 'buildShinyPrompt(item.dex,shinyBase,false)' in block
          assert 'buildShinyPrompt(item.dex,shinyBase,true)' in block
          print("Verified actual Shiny x1/x3 buttons call buildShinyPrompt")
          PY

      - name: Verify compiled native Shiny button wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path("appsrc/app/src/main/java/com/novaris/pokedex/nativeapp/DetailActivity.java").read_text()
          for word in ("shinyFile","buildShinyPrompt","Copy shiny image","shinyJson"):
              for m in list(re.finditer(re.escape(word),s,re.I))[:5]:
                  print("SOURCE",word,repr(s[max(0,m.start()-220):m.end()+260]))
          assert "BLUE, NOT YELLOW" in s
          PY

      - name: Set v0.5.4 version
        shell: bash
        run: |
          sed -i 's/versionCode = 8/versionCode = ${{ github.run_number }} + 1000/' appsrc/app/build.gradle.kts
          sed -i 's/versionName = "0.5.3-native"/versionName = "0.5.23-native"/' appsrc/app/build.gradle.kts
          grep -n 'versionCode\|versionName' appsrc/app/build.gradle.kts
          grep -F 'versionCode = ${{ github.run_number }} + 1000' appsrc/app/build.gradle.kts
          grep -F 'versionName = "0.5.23-native"' appsrc/app/build.gradle.kts

      - name: Install Arcanine launcher icon
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          import shutil
          icon=Path("26993.png")
          if not icon.is_file():raise SystemExit("Arcanine icon 26993.png missing")
          res=Path("appsrc/app/src/main/res")
          for folder in ("mipmap-mdpi","mipmap-hdpi","mipmap-xhdpi","mipmap-xxhdpi","mipmap-xxxhdpi"):
              target=res/folder
              target.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(icon,target/"ic_launcher.png")
              shutil.copyfile(icon,target/"ic_launcher_round.png")
          manifest=Path("appsrc/app/src/main/AndroidManifest.xml")
          content=manifest.read_text()
          content=content.replace('android:icon="@drawable/ic_launcher"','android:icon="@mipmap/ic_launcher"')
          content=content.replace('android:icon="@mipmap/ic_launcher_foreground"','android:icon="@mipmap/ic_launcher"')
          if 'android:icon=' not in content:
              content=content.replace('<application','<application android:icon="@mipmap/ic_launcher"',1)
          if 'android:roundIcon=' not in content:
              content=content.replace('<application','<application android:roundIcon="@mipmap/ic_launcher_round"',1)
          manifest.write_text(content)
          print("Arcanine launcher icon installed")
          PY

      - name: Restore stable signing key
        shell: bash
        run: |
          base64 --decode appsrc/signing-key.b64 > appsrc/novaris-local-signing.jks
          test -s appsrc/novaris-local-signing.jks

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install converter
        run: pip install --disable-pip-version-check lxml

      - name: Prepare source data
        shell: bash
        run: |
          gunzip -c Pokedex_V27_42.html.gz > Pokedex_V27_42.html
          test $(stat -c%s Pokedex_V27_42.html) -ge 100000000

      - name: Extract exact V27.42 original variant inputs
        run: python3 native/v0.5.4/extract_original_variants.py

      - name: Install original native variant engine
        run: |
          cp native/v0.5.4/OriginalVariantEngine.java appsrc/app/src/main/java/com/novaris/pokedex/nativeapp/OriginalVariantEngine.java
          cp native/v0.5.4/novaris_species_lifestyle_blueprints_v1.json appsrc/app/src/main/assets/novaris_species_lifestyle_blueprints_v1.json
          cp native/v0.5.4/novaris_lifestyle_block_0001_0050_v2.json appsrc/app/src/main/assets/novaris_lifestyle_block_0001_0050_v2.json
          cp native/v0.5.4/novaris_lifestyle_block_0051_0100_v2.json appsrc/app/src/main/assets/novaris_lifestyle_block_0051_0100_v2.json
          cp native/v0.5.4/novaris_lifestyle_block_0101_0150_v2.json appsrc/app/src/main/assets/novaris_lifestyle_block_0101_0150_v2.json
          cp native/v0.5.4/novaris_lifestyle_block_0151_0200_v2.json appsrc/app/src/main/assets/novaris_lifestyle_block_0151_0200_v2.json
          cp native/v0.5.4/novaris_lifestyle_block_0201_0250_v2.json appsrc/app/src/main/assets/novaris_lifestyle_block_0201_0250_v2.json
          cp native/v0.5.4/novaris_lifestyle_block_0251_0300_v2.json appsrc/app/src/main/assets/novaris_lifestyle_block_0251_0300_v2.json
          cp native/v0.5.4/novaris_lifestyle_block_0301_0350_v2.json appsrc/app/src/main/assets/novaris_lifestyle_block_0301_0350_v2.json
          cp native/v0.5.4/novaris_lifestyle_block_0351_0400_v2.json appsrc/app/src/main/assets/novaris_lifestyle_block_0351_0400_v2.json
          cp native/v0.5.4/novaris_lifestyle_block_0401_0450_v2.json appsrc/app/src/main/assets/novaris_lifestyle_block_0401_0450_v2.json
          cp native/v0.5.4/novaris_lifestyle_block_0451_0500_v2.json appsrc/app/src/main/assets/novaris_lifestyle_block_0451_0500_v2.json
          cp native/v0.5.4/novaris_lifestyle_block_0501_0550_v2.json appsrc/app/src/main/assets/novaris_lifestyle_block_0501_0550_v2.json
          cp native/v0.5.4/novaris_lifestyle_block_0551_0600_v2.json appsrc/app/src/main/assets/novaris_lifestyle_block_0551_0600_v2.json
          cp native/v0.5.4/novaris_lifestyle_block_0601_0650_v2.json appsrc/app/src/main/assets/novaris_lifestyle_block_0601_0650_v2.json
          cp native/v0.5.4/novaris_lifestyle_block_0651_0700_v2.json appsrc/app/src/main/assets/novaris_lifestyle_block_0651_0700_v2.json
          cp native/v0.5.4/novaris_lifestyle_block_0701_0750_v2.json appsrc/app/src/main/assets/novaris_lifestyle_block_0701_0750_v2.json
          cp native/v0.5.4/novaris_lifestyle_block_0751_0800_v2.json appsrc/app/src/main/assets/novaris_lifestyle_block_0751_0800_v2.json
          cp native/v0.5.4/novaris_lifestyle_block_0801_0850_v2.json appsrc/app/src/main/assets/novaris_lifestyle_block_0801_0850_v2.json
          cp native/v0.5.4/novaris_lifestyle_block_0851_0900_v2.json appsrc/app/src/main/assets/novaris_lifestyle_block_0851_0900_v2.json
          cp native/v0.5.4/novaris_lifestyle_block_0901_0950_v2.json appsrc/app/src/main/assets/novaris_lifestyle_block_0901_0950_v2.json
          cp native/v0.5.4/novaris_lifestyle_block_0951_1000_v2.json appsrc/app/src/main/assets/novaris_lifestyle_block_0951_1000_v2.json
          cp native/v0.5.4/novaris_lifestyle_block_1001_1025_v2.json appsrc/app/src/main/assets/novaris_lifestyle_block_1001_1025_v2.json

      - name: Wire six native optional variant buttons
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("appsrc/app/src/main/java/com/novaris/pokedex/nativeapp/DetailActivity.java")
          s=p.read_text()
          needle='private void showPokemon(int dex){'
          if needle not in s: raise SystemExit("Pokemon detail anchor absent")
          anchor='addFormCards("Weitere Formen",d.item,d.formsJson);'
          if anchor not in s:raise SystemExit("Main form variant insertion anchor missing")
          s=s.replace(anchor,'addOriginalVariants(dex);\n        '+anchor,1)
          method=r"""
          private void addOriginalVariants(int dex){
              try{
                  java.io.InputStream in=getAssets().open("novaris_original_variants.json");
                  java.io.ByteArrayOutputStream out=new java.io.ByteArrayOutputStream();
                  byte[] buf=new byte[8192];int n;
                  while((n=in.read(buf))!=-1)out.write(buf,0,n);
                  in.close();
                  JSONObject root=new JSONObject(out.toString("UTF-8"));
                  JSONArray variants=root.getJSONObject("V2713_ASSIGNMENTS").optJSONArray(String.valueOf(dex));
                  if(variants==null||variants.length()!=6)return;
                  LinearLayout section=new LinearLayout(this);
                  section.setOrientation(LinearLayout.VERTICAL);
                  Button toggle=button("Lifestyle · 3  ▾");
                  section.addView(toggle);
                  LinearLayout contents=new LinearLayout(this);
                  contents.setOrientation(LinearLayout.VERTICAL);
                  contents.setVisibility(android.view.View.GONE);
                  toggle.setOnClickListener(v->{boolean open=contents.getVisibility()!=android.view.View.VISIBLE;contents.setVisibility(open?android.view.View.VISIBLE:android.view.View.GONE);toggle.setText(open?"Lifestyle · 3  ▴":"Lifestyle · 3  ▾");});
                  section.addView(contents);
                  for(int i=3;i<6;i++){
                      final String variant=variants.optString(i);
                      final boolean lifestyle=i>=3;
                      DatabaseManager.PokemonDetail detail=data.pokemonDetail(dex);
                      if(detail==null)continue;
                      String filename=String.format(java.util.Locale.ROOT,"#%04d.%s_%s",dex,OriginalVariantEngine.slug(detail.item.en),OriginalVariantEngine.slug(variant));
                      LinearLayout card=new LinearLayout(this);
                      card.setOrientation(LinearLayout.VERTICAL);
                      card.setPadding(dp(8),dp(10),dp(8),dp(14));
                      TextView name=label(variant,16,true);
                      card.addView(name);
                      ImageView picture=image(dp(84),dp(84));
                      card.addView(picture,new LinearLayout.LayoutParams(dp(84),dp(84)));
                      ImageLoader.load(this,detail.item.art,picture);
                      Button copyImage=button("Copy image");
                      copyImage.setOnClickListener(v->ImageClipboard.copy(this,detail.item.art));
                      card.addView(copyImage,new LinearLayout.LayoutParams(match(),wrap()));
                      Button copyFilename=button(filename);
                      copyFilename.setOnClickListener(v->copy(filename+DOWNLOAD_SUFFIX));
                      card.addView(copyFilename,new LinearLayout.LayoutParams(match(),wrap()));
                      LinearLayout row=new LinearLayout(this);
                      row.setOrientation(LinearLayout.HORIZONTAL);
                      Button x1=button("Copy "+variant+" + Core + Dex x1");
                      Button x3=button("Copy "+variant+" + Core + Dex x3");
                      x1.setOnClickListener(v->copy(originalVariantPrompt(dex,variant,lifestyle,false,root)));
                      x3.setOnClickListener(v->copy(originalVariantPrompt(dex,variant,lifestyle,true,root)));
                      row.addView(x1,new LinearLayout.LayoutParams(0,dp(66),1));
                      row.addView(x3,new LinearLayout.LayoutParams(0,dp(66),1));
                      card.addView(row);
                      contents.addView(card);
                  }
                  body.addView(section);
              }catch(Exception e){android.util.Log.e("NovarisVariants","Cannot load original variants",e);}
          }
          private String originalVariantPrompt(int dex,String variant,boolean lifestyle,boolean triple,JSONObject root){
              try{
                  return OriginalVariantEngine.build(this,root,dex,variant,triple);
              }catch(Exception e){
                  android.util.Log.e("NovarisVariants","Original prompt failed",e);
                  return "Variant prompt error: "+e.getMessage();
              }
          }
          """
          anchor='private void copy(String s){'
          if anchor not in s:raise SystemExit("Variant method anchor missing")
          s=s.replace(anchor,method+'\n    '+anchor,1)
          p.write_text(s)
          assert s.index('addOriginalVariants(dex);') < s.index('addFormCards("Weitere Formen",d.item,d.formsJson);')
          assert 'ImageClipboard.copy(this,detail.item.art)' in s
          assert 'originalVariantPrompt(dex,variant,lifestyle,true,root)' in s
          PY

      - name: Convert V27.42
        shell: bash
        run: |
          mkdir -p appsrc/app/src/main/assets
          python appsrc/tools/convert_pokedex.py Pokedex_V27_42.html appsrc/app/src/main/assets/pokedex.db.gzdata --version V27.42
          test -s appsrc/app/src/main/assets/pokedex.db.gzdata

      - name: Inspect native update implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for p in Path("appsrc/app/src/main/java").rglob("*.java"):
              s=p.read_text()
              if any(k in s for k in ("Online-Update","Datenupdate verfügbar","github.com","api.github.com")):
                  print("UPDATE_SOURCE",p)
                  for k in ("Online-Update","Datenupdate verfügbar","github.com","api.github.com"):
                      for m in list(re.finditer(re.escape(k),s))[:4]:
                          print("UPDATE_CONTEXT",k,repr(s[max(0,m.start()-450):m.end()+700]))
          PY

      - name: Install native in-app APK updater
        shell: bash
        run: |
          cp native/v0.5.4/AppReleaseUpdater.java appsrc/app/src/main/java/com/novaris/pokedex/nativeapp/AppReleaseUpdater.java
          python3 - <<'PY'
          from pathlib import Path
          p=Path("appsrc/app/src/main/java/com/novaris/pokedex/nativeapp/MainActivity.java")
          s=p.read_text()
          marker="private boolean restorePosition;"
          if marker not in s:raise SystemExit("Updater MainActivity anchor missing")
          s=s.replace(marker,marker+"\n    private AppReleaseUpdater releaseUpdater;",1)
          anchor="    private void openPokemon("
          if anchor not in s:raise SystemExit("Updater method anchor missing")
          method="""    @Override protected void onResume(){
              super.onResume();
              if(releaseUpdater==null)releaseUpdater=new AppReleaseUpdater(this);
              getWindow().getDecorView().postDelayed(()->{releaseUpdater.attach();releaseUpdater.onAppResume();},300);
          }
          """
          # Do not generate a duplicate lifecycle override when the reconstructed source already has one.
          import re
          existing=re.search(r'(?:@Override\s+)?(?:public|protected)\s+void\s+onResume\s*\(\s*\)\s*\{',s)
          if existing:
              start=existing.end()
              depth=1
              end=start
              while end<len(s) and depth:
                  if s[end]=='{':depth+=1
                  elif s[end]=='}':depth-=1
                  end+=1
              if depth:raise SystemExit("Unbalanced existing onResume method")
              block=s[start:end-1]
              if 'releaseUpdater.onAppResume()' not in block:
                  if 'super.onResume();' not in block:raise SystemExit("Existing onResume has no super call")
                  s=s[:start]+block.replace('super.onResume();','super.onResume();\n        if(releaseUpdater==null)releaseUpdater=new AppReleaseUpdater(this);\n        getWindow().getDecorView().postDelayed(()->{releaseUpdater.attach();releaseUpdater.onAppResume();},300);',1)+s[end-1:]
          else:
              s=s.replace(anchor,method+anchor,1)
          if len(re.findall(r'\bvoid\s+onResume\s*\(',s))!=1:
              raise SystemExit("Expected exactly one MainActivity onResume method")
          p.write_text(s)
          manifest=Path("appsrc/app/src/main/AndroidManifest.xml")
          m=manifest.read_text()
          if 'android.permission.REQUEST_INSTALL_PACKAGES' not in m:
              if m.count('<application')!=1:
                  raise SystemExit("Cannot safely insert package-install permission: application tag missing or ambiguous")
              m=m.replace('<application','<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <application',1)
          manifest.write_text(m)
          assert 'releaseUpdater.attach()' in s
          assert s.count('private AppReleaseUpdater releaseUpdater;') == 1
          assert len(re.findall(r'\bvoid\s+onResume\s*\(',s)) == 1
          assert 'android.permission.REQUEST_INSTALL_PACKAGES' in m
          assert m.count('android.permission.REQUEST_INSTALL_PACKAGES') == 1
          PY

      - name: Restore six original class and lifestyle variants for every additional form
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("appsrc/app/src/main/java/com/novaris/pokedex/nativeapp/DetailActivity.java")
          s=p.read_text()
          anchor='addFormCards("Weitere Formen",d.item,d.formsJson);'
          if anchor not in s:raise SystemExit("Additional form insertion point missing")
          s=s.replace(anchor,anchor,1)
          hook='addFormCards("Weitere Formen",d.item,d.formsJson);'
          if hook not in s:raise SystemExit("Form list insertion point missing")
          wiring='\n        try{\n            JSONArray forms=new JSONArray(d.formsJson);\n            for(int fi=0;fi<forms.length();fi++){\n                JSONObject form=forms.optJSONObject(fi);\n                if(form!=null) addFormClassVariants(d.item.dex,fi+1,form.optString("name","Form"),form.optString("url",""),form.optString("blueprint",""),body.getChildCount()-forms.length()+fi+1);\n            }\n        }catch(Exception e){android.util.Log.e("NovarisFormVariants","Cannot render form variants",e);}\n        '
          s=s.replace(hook,hook+wiring,1)
          method=r"""
          private void addFormClassVariants(int dex,int formIndex,String formName,String formUrl,String blueprint,int insertIndex){
              try{
                  java.io.InputStream in=getAssets().open("novaris_original_variants.json");
                  java.io.ByteArrayOutputStream out=new java.io.ByteArrayOutputStream();
                  byte[] buffer=new byte[8192];int n;
                  while((n=in.read(buffer))!=-1)out.write(buffer,0,n);
                  in.close();
                  JSONObject root=new JSONObject(out.toString("UTF-8"));
                  JSONArray variants=root.getJSONObject("V2713_ASSIGNMENTS").optJSONArray(String.valueOf(dex));
                  if(variants==null||variants.length()!=6)return;
                  DatabaseManager.PokemonDetail detail=data.pokemonDetail(dex);
                  if(detail==null)return;
                  LinearLayout section=new LinearLayout(this);
                  section.setOrientation(LinearLayout.VERTICAL);
                  section.setPadding(dp(8),dp(8),dp(8),dp(8));
                  Button toggle=button("Optionale Klassen & Varianten · 6  ▾");
                  section.addView(toggle);
                  LinearLayout contents=new LinearLayout(this);
                  contents.setOrientation(LinearLayout.VERTICAL);
                  contents.setVisibility(android.view.View.GONE);
                  toggle.setOnClickListener(v->{
                      boolean open=contents.getVisibility()!=android.view.View.VISIBLE;
                      contents.setVisibility(open?android.view.View.VISIBLE:android.view.View.GONE);
                      toggle.setText(open?"Optionale Klassen & Varianten · 6  ▴":"Optionale Klassen & Varianten · 6  ▾");
                  });
                  section.addView(contents);
                  for(int i=3;i<6;i++){
                      final String variant=variants.optString(i);
                      final String title=String.format(java.util.Locale.ROOT,"#%04d.%s_%02d_%s_%s",dex,
                          OriginalVariantEngine.slug(detail.item.en),formIndex,OriginalVariantEngine.slug(formName),OriginalVariantEngine.slug(variant));
                      LinearLayout card=new LinearLayout(this);
                      card.setOrientation(LinearLayout.VERTICAL);
                      card.setPadding(dp(8),dp(10),dp(8),dp(10));
                      card.addView(label("LIFESTYLE "+(i-2)+"/3",14,true));
                      ImageView preview=image(dp(84),dp(84));
                      card.addView(preview,new LinearLayout.LayoutParams(dp(84),dp(84)));
                      ImageLoader.load(this,formUrl,preview);
                      Button imageButton=button("Copy image");
                      imageButton.setOnClickListener(v->ImageClipboard.copy(this,formUrl));
                      card.addView(imageButton);
                      Button fileButton=button(title);
                      fileButton.setOnClickListener(v->copy(title+DOWNLOAD_SUFFIX));
                      card.addView(fileButton);
                      LinearLayout actions=new LinearLayout(this);
                      actions.setOrientation(LinearLayout.HORIZONTAL);
                      Button one=button(variant+" x1");
                      Button three=button(variant+" x3");
                      one.setOnClickListener(v->copy(formVariantPrompt(dex,formName,blueprint,variant,false,root)));
                      three.setOnClickListener(v->copy(formVariantPrompt(dex,formName,blueprint,variant,true,root)));
                      actions.addView(one,new LinearLayout.LayoutParams(0,dp(62),1));
                      actions.addView(three,new LinearLayout.LayoutParams(0,dp(62),1));
                      card.addView(actions);
                      contents.addView(card);
                  }
                  body.addView(section,Math.min(insertIndex,body.getChildCount()));
              }catch(Exception e){android.util.Log.e("NovarisFormVariants","Cannot build form variants",e);}
          }
          private String formVariantPrompt(int dex,String formName,String blueprint,String variant,boolean triple,JSONObject root){
              try{
                  String original=OriginalVariantEngine.build(this,root,dex,variant,triple);
                  String formContext="MANDATORY FORM IDENTITY: "+formName+
                      ". Use the exact selected form reference image, not the base species. "+
                      "FORM BLUEPRINT: "+blueprint+
                      ". The form's source colors, silhouette and details override the normal form where different. "+
                      "Keep the selected optional class or lifestyle role unchanged.";
                  return formContext+"\n\n"+original;
              }catch(Exception e){return "Variant prompt error: "+e.getMessage();}
          }
          """
          insertion='private void copy(String s){'
          if insertion not in s:raise SystemExit("Copy method insertion point missing")
          s=s.replace(insertion,method+'\n    '+insertion,1)
          p.write_text(s)
          assert 'addFormClassVariants(d.item.dex,fi+1' in s
          assert 'formVariantPrompt(dex,formName,blueprint,variant,true,root)' in s
          print("Restored six per-form variants with independent image and prompt buttons")
          PY

      - name: Enforce non-anatomical species translation and independent x3 images
        shell: bash
        run: |
          cp native/v0.5.4/PromptSafety.java appsrc/app/src/main/java/com/novaris/pokedex/nativeapp/PromptSafety.java
          cp native/v0.5.4/NOVARIS_STYLE_CORE_GEN1_TEST_v1.0.0.md appsrc/app/src/main/assets/NOVARIS_STYLE_CORE_GEN1_TEST_v1.0.0.md
          python3 - <<'PY'
          from pathlib import Path
          p=Path("appsrc/app/src/main/java/com/novaris/pokedex/nativeapp/DetailActivity.java")
          s=p.read_text()
          anchor='private void copy(String s){'
          if anchor not in s:raise SystemExit("Copy method not found")
          # Every x3 listener uses the dedicated triple-aware copy path.
          import re
          matches=0
          for name in ('x3','b3'):
              pattern=r'(?m)(\b'+name+r'\.setOnClickListener\(v->)copy\('
              s,n=re.subn(pattern,r'\1copyTriple(',s)
              matches+=n
          if matches<2:raise SystemExit("x3 copy wiring missing")
          # Keep the original copy method intact; wrap only the triple listeners.
          s=s.replace(anchor,'private void copyTriple(String s){ copy(PromptSafety.enforce(s,true)); }\n    '+anchor,1)
          # The ordinary copy path must also enforce the species-to-fashion guard.
          # Avoid double-appending to prompts that already include the safety header.
          start=s.index(anchor)
          end=s.find('\n    private ',start+len(anchor))
          if end<0:end=len(s)
          block=s[start:end]
          if 'PromptSafety.enforce' not in block:
              block=block.replace(anchor,anchor+'\n        if(s!=null && !s.startsWith("NOVARIS OUTPUT CONTROL") && (s.contains("SPECIES IDENTITY:") || s.contains("NOVARIS OPTIONAL CLASS") || s.contains("NOVARIS LIFESTYLE VARIANT"))) s=PromptSafety.enforce(s,false);',1)
              s=s[:start]+block+s[end:]
          p.write_text(s)
          print("Triple copy listeners:",matches)
          assert 'copyTriple(' in s
          PY

