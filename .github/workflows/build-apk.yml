name: Build Novaris APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'bundle/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct Android source
        shell: bash
        run: |
          cat bundle/part*.b64 | base64 --decode > Novaris-Android-v0.3.0-source.zip
          unzip -q Novaris-Android-v0.3.0-source.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: Novaris-Android
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Novaris-Pokedex-APK-v0.3.0
          path: Novaris-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
