name: Build Novaris APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'bundle/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct Android source
        shell: bash
        run: |
          cat bundle/part*.b64 | base64 --decode > Novaris-Android-v0.3.0-source.zip
          unzip -q Novaris-Android-v0.3.0-source.zip

      - name: Prepare compatibility build v0.3.1
        shell: bash
        run: |
          sed -i 's/applicationId = "com.novaris.pokedex"/applicationId = "com.novaris.pokedex.v031"/' Novaris-Android/app/build.gradle.kts
          sed -i 's/minSdk = 26/minSdk = 23/' Novaris-Android/app/build.gradle.kts
          sed -i 's/versionCode = 3/versionCode = 4/' Novaris-Android/app/build.gradle.kts
          sed -i 's/versionName = "0.3.0"/versionName = "0.3.1"/' Novaris-Android/app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: Novaris-Android
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        shell: bash
        run: cp Novaris-Android/app/build/outputs/apk/debug/app-debug.apk Novaris-Pokedex-v0.3.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Novaris-Pokedex-APK-v0.3.1
          path: Novaris-Pokedex-v0.3.1.apk
          if-no-files-found: error
          retention-days: 14
